<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The free, open-source and non-profit search engine." />
    <title>Mwmbl Search</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts/inter/inter.css" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/global.css" />
  </head>
  <body>
    <mwmbl-app></mwmbl-app>
    <header class="search-menu compact">
      <a href="/" class="branding">
        <img class="brand-icon" src="/images/logo.svg" width="40" height="40" alt="Mwmbl logo" />
        <span class="brand-title">Mwmbl</span>
      </a>
      <form class="search-bar" action="/" method="get">
        <i class="ph-magnifying-glass-bold"></i>
        <input type="search" name="q" class="search-bar-input" placeholder="Search on Mwmbl..." autocomplete="off" />
      </form>
      <button type="button" class="local-ai-toggle" data-local-ai-toggle aria-label="Use local AI to improve result ranking">Local AI</button>
      <span class="local-ai-status" data-local-ai-status role="status">AI off</span>
      <a class="button" href="/accounts/login/">Login</a>
      <a class="button" href="/accounts/signup/">Sign up</a>
    </header>
    <main><div class="main">
      <h1>Welcome to Mwmbl</h1>
      <p>The free, open-source and non-profit search engine.</p>
      <p>Search the community-built index above, or enable Local AI to improve result ranking using your device.</p>
    </div></main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
